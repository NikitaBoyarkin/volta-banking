name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # Structural gate on the dbt-charts board (charts/volta-core.yml): schema
      # and cross-refs only, no warehouse. --strict fails on warnings, so a
      # stale or malformed board cannot outlive the data it describes. The
      # board's rendered HTML is published to the portfolio site; regenerate it
      # from here and copy public/demos/volta-board/index.html over there.
      - name: Validate dbt-charts board
        run: uvx --from dbt-charts dct validate charts/volta-core.yml --strict
