name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # Structural gate on the dbt-charts board (charts/volta-core.yml): schema
      # and cross-refs only, no warehouse — it never opens the board's file
      # sources. The render below is what proves the board can actually be
      # built. The portfolio site re-renders it from this repo at deploy time.
      #
      # The version is pinned on purpose. An unpinned `uvx --from dbt-charts`
      # pulled 0.10.0, whose grammar had moved: `--strict` turned the resulting
      # WARN-SCHEMA-MIGRATED into a red build, and 0.10.0's renderer cannot
      # ingest data/charts/funnel.csv at all (Arrow "ResourceInUseException" on
      # `activation_rate` / `funnel_steps`), so migrating the board alone would
      # move the failure one step down. Bump both pins together, with
      # `dct migrate charts/`, once a release renders this board.
      - name: Validate dbt-charts board
        run: uvx --from dbt-charts==0.9.1 dct validate charts/volta-core.yml --strict

      # data/charts/funnel.csv is derived (scripts/build_charts_data.py) and
      # gitignored, so a fresh checkout carries no board data at all and
      # `dct validate` passes regardless. Only a real render notices a missing
      # or malformed source — otherwise first seen in the site's deploy job.
      - name: Materialise board CSV
        run: uv run python scripts/build_charts_data.py

      - name: Render dbt-charts board
        run: |
          uvx --from dbt-charts==0.9.1 dct render charts/volta-core.yml \
            --format html \
            --output "$RUNNER_TEMP/volta-core.html"
