[project]
name = "volta-banking"
version = "0.1.0"
description = "Onboarding funnel analysis for Volta Neobank"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.0",
    # Report generation
    "openpyxl>=3.1.0",
    # PDF processing
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
    "shap>=0.49.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
src = ["scripts", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
# Coverage (REQ-005 / PA-06): every `scripts/volta_*.py` analysis on disk is
# listed below, plus the board builder, the impact artifact builder and shared
# utils. `tests/test_type_coverage.py` fails when a new analysis is added
# without an entry, so this list cannot silently fall behind.
#
# Exactly 4 modules carry `# mypy: ignore-errors` at the top of the file --
# they are the legacy pandas-heavy analyses where retrofitting annotations
# would risk changing runtime behaviour:
#   volta_funnel_analysis.py, volta_ab_testing.py,
#   volta_retention_analysis.py, volta_segmentation.py
# Every other analysis module is type-checked without an ignore marker.
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
files = [
    "scripts/volta_churn_prediction.py",
    "scripts/volta_rfm_analysis.py",
    "scripts/volta_clv_modeling.py",
    "scripts/volta_attribution.py",
    "scripts/volta_anomaly_detection.py",
    "scripts/volta_spend_analysis.py",
    "scripts/volta_cs_churn.py",
    "scripts/volta_nps_trends.py",
    "scripts/volta_jtbd_mapping.py",
    "scripts/volta_unit_economics.py",
    "scripts/volta_premium_upsell.py",
    "scripts/volta_kyc_deep_dive.py",
    "scripts/volta_referral_segments.py",
    "scripts/volta_causal_kyc.py",
    # Added by REQ-005: the nine analyses that were outside the gate.
    "scripts/volta_ab_testing.py",
    "scripts/volta_anchor_cac.py",
    "scripts/volta_assisted_cac.py",
    "scripts/volta_dormant_winback.py",
    "scripts/volta_funnel_analysis.py",
    "scripts/volta_fx_sourcing.py",
    "scripts/volta_premium_offers.py",
    "scripts/volta_retention_analysis.py",
    "scripts/volta_segmentation.py",
    "scripts/volta_feature_adoption.py",
    "scripts/build_impact.py",
    "scripts/build_board.py",
    "utils/common.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "--cov=volta_funnel_analysis --cov=volta_ab_testing --cov=volta_retention_analysis --cov=volta_segmentation --cov=volta_churn_prediction --cov=volta_rfm_analysis --cov=volta_clv_modeling --cov=volta_attribution --cov=volta_anomaly_detection --cov=volta_jtbd_mapping --cov=volta_unit_economics --cov=volta_premium_upsell --cov=volta_kyc_deep_dive --cov=volta_referral_segments --cov=volta_causal_kyc --cov=volta_assisted_cac --cov=volta_fx_sourcing --cov=volta_premium_offers --cov=volta_anchor_cac --cov=volta_dormant_winback --cov=build_board --cov=utils --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
# utils/pdf_processor.py and utils/report_generator.py are legacy/speculative
# modules not imported by the four analysis scripts (see CLAUDE.md). Excluded so
# the headline metric reflects active analytical code.
omit = [
    "utils/pdf_processor.py",
    "utils/report_generator.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
