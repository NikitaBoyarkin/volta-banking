[project]
name = "volta-banking"
version = "0.1.0"
description = "Onboarding funnel analysis for Volta Neobank"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.0",
    # Report generation
    "openpyxl>=3.1.0",
    # PDF processing
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
# The four legacy analysis scripts are dynamic pandas code (see CLAUDE.md) and
# carry `# mypy: ignore-errors`; mypy enforces typing on NEW code (Sprint 3+).
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
files = [
    "volta_churn_prediction.py",
    "volta_rfm_analysis.py",
    "volta_clv_modeling.py",
    "volta_attribution.py",
    "volta_anomaly_detection.py",
    "volta_spend_analysis.py",
    "volta_cs_churn.py",
    "volta_nps_trends.py",
    "volta_jtbd_mapping.py",
    "volta_unit_economics.py",
    "volta_premium_upsell.py",
    "volta_kyc_deep_dive.py",
    "utils/common.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=volta_funnel_analysis --cov=volta_ab_testing --cov=volta_retention_analysis --cov=volta_segmentation --cov=volta_churn_prediction --cov=volta_rfm_analysis --cov=volta_clv_modeling --cov=volta_attribution --cov=volta_anomaly_detection --cov=volta_jtbd_mapping --cov=volta_unit_economics --cov=volta_premium_upsell --cov=volta_kyc_deep_dive --cov=utils --cov-report=term-missing"

[tool.coverage.run]
# utils/pdf_processor.py and utils/report_generator.py are legacy/speculative
# modules not imported by the four analysis scripts (see CLAUDE.md). Excluded so
# the headline metric reflects active analytical code.
omit = [
    "utils/pdf_processor.py",
    "utils/report_generator.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
