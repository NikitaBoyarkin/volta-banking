[project]
name = "volta-banking"
version = "0.1.0"
description = "Onboarding funnel analysis for Volta Neobank"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.31.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.0",
    # Report generation
    "openpyxl>=3.1.0",
    # PDF processing
    "pdfplumber>=0.10.0",
    "pypdf>=4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]
